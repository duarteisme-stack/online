<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Details</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center">
    <div class="mx-auto w-14 h-14 rounded-full bg-green-500 text-white flex items-center justify-center text-2xl">✓</div>
    <h1 class="text-xl font-bold mt-3 text-slate-800">Valid Appointment</h1>
    <div id="info" class="mt-5 text-left text-sm space-y-2"></div>
  </div>
<script>
  const esc = t => String(t??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  try{
    const d = JSON.parse(decodeURIComponent(atob(new URLSearchParams(location.search).get('d'))));
    info.innerHTML = `
      <p><b>Name:</b> ${esc(d.name)}</p>
      <p><b>Email:</b> ${esc(d.email)}</p>
      <p><b>Date:</b> <span class="text-green-600 font-bold">${esc(d.date)}</span></p>
      ${d.reason?`<p><b>Reason:</b> ${esc(d.reason)}</p>`:''}`;
  }catch(e){ info.innerHTML = '<p class="text-red-500">Invalid QR code.</p>'; }
</script>
</body>
</html>
